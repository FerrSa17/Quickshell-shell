"$schema" = 'https://starship.rs/config-schema.json'

# Auto-generated by ~/.config/starship/apply-colors.py — do not edit colors by hand.
# Re-run that script (or change wallpaper) to refresh the palette.

format = """
[](#dac4b4)\
$os\
[](bg:#cf8c59 fg:#dac4b4)\
$directory\
[](fg:#cf8c59 bg:#574638)\
$git_branch\
$git_status\
[](fg:#574638 bg:#342e27)\
$package\
$nodejs\
$bun\
$python\
$rust\
$golang\
$php\
[](fg:#342e27 bg:#24211e)\
$time\
[ ](fg:#24211e)\
\n$status$character"""

right_format = """$cmd_duration"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[status]
disabled = false
symbol = "󰅗"
style = "bold red"
format = "[$symbol $status ]($style)"

[directory]
style = "fg:#141717 bg:#cf8c59"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#574638"
format = '[[ $symbol $branch ](fg:#d1986b bg:#574638)]($style)'

[git_status]
style = "bg:#574638"
format = '[[($all_status$ahead_behind )](fg:#d1986b bg:#574638)]($style)'

[package]
symbol = "󰏗"
style = "bg:#342e27"
format = '[[ $symbol $version ](fg:#d1986b bg:#342e27)]($style)'

[nodejs]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version) ](fg:#d1986b bg:#342e27)]($style)'

[bun]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version) ](fg:#d1986b bg:#342e27)]($style)'

[python]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version)(\($virtualenv\)) ](fg:#d1986b bg:#342e27)]($style)'
detect_extensions = ["py", "ipynb"]
detect_files = [
  "requirements.txt",
  "pyproject.toml",
  ".python-version",
  "Pipfile",
  "tox.ini",
  "setup.py",
  "__init__.py",
]
detect_folders = [".venv", "venv"]

[rust]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version) ](fg:#d1986b bg:#342e27)]($style)'

[golang]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version) ](fg:#d1986b bg:#342e27)]($style)'

[php]
symbol = ""
style = "bg:#342e27"
format = '[[ $symbol ($version) ](fg:#d1986b bg:#342e27)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#24211e"
format = '[[  $time ](fg:#c9b5a6 bg:#24211e)]($style)'

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "fg:#d1986b"
format = "[](fg:#24211e)[  $duration ](fg:#c9b5a6 bg:#24211e)[](fg:#24211e)"

[os]
style = "bg:#dac4b4 fg:#141717"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
