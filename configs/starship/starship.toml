"$schema" = 'https://starship.rs/config-schema.json'

# Auto-generated by ~/.config/starship/apply-colors.py — do not edit colors by hand.
# Re-run that script (or change wallpaper) to refresh the palette.

format = """
[](#bcd2cc)\
$os\
[](bg:#74b4a2 fg:#bcd2cc)\
$directory\
[](fg:#74b4a2 bg:#385755)\
$git_branch\
$git_status\
[](fg:#385755 bg:#273434)\
$package\
$nodejs\
$bun\
$python\
$rust\
$golang\
$php\
[](fg:#273434 bg:#1e2424)\
$time\
[ ](fg:#1e2424)\
\n$status$character"""

right_format = """$cmd_duration"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[status]
disabled = false
symbol = "󰅗"
style = "bold red"
format = "[$symbol $status ]($style)"

[directory]
style = "fg:#141717 bg:#74b4a2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#385755"
format = '[[ $symbol $branch ](fg:#7cc0ad bg:#385755)]($style)'

[git_status]
style = "bg:#385755"
format = '[[($all_status$ahead_behind )](fg:#7cc0ad bg:#385755)]($style)'

[package]
symbol = "󰏗"
style = "bg:#273434"
format = '[[ $symbol $version ](fg:#7cc0ad bg:#273434)]($style)'

[nodejs]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version) ](fg:#7cc0ad bg:#273434)]($style)'

[bun]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version) ](fg:#7cc0ad bg:#273434)]($style)'

[python]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version)(\($virtualenv\)) ](fg:#7cc0ad bg:#273434)]($style)'
detect_extensions = ["py", "ipynb"]
detect_files = [
  "requirements.txt",
  "pyproject.toml",
  ".python-version",
  "Pipfile",
  "tox.ini",
  "setup.py",
  "__init__.py",
]
detect_folders = [".venv", "venv"]

[rust]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version) ](fg:#7cc0ad bg:#273434)]($style)'

[golang]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version) ](fg:#7cc0ad bg:#273434)]($style)'

[php]
symbol = ""
style = "bg:#273434"
format = '[[ $symbol ($version) ](fg:#7cc0ad bg:#273434)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1e2424"
format = '[[  $time ](fg:#a6c9bf bg:#1e2424)]($style)'

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "fg:#7cc0ad"
format = "[](fg:#1e2424)[  $duration ](fg:#a6c9bf bg:#1e2424)[](fg:#1e2424)"

[os]
style = "bg:#bcd2cc fg:#141717"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
