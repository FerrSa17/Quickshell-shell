# Auto-generated by ~/.config/yazi/apply-wallpaper-theme.py — do not edit colors by hand.
# Re-run that script (or change wallpaper) to refresh the palette.
#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
dark  = ""
light = ""

[mgr]
cwd = { fg = "#d38c55" }

find_keyword  = { fg = "#dda65f", bold = true, italic = true, underline = true }
find_position = { fg = "#64c7d8", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#66635c", italic = true }

marker_copied   = { fg = "#afdf90",  bg = "#afdf90" }
marker_cut      = { fg = "#e2787c",     bg = "#e2787c" }
marker_marked   = { fg = "#afdf90",  bg = "#afdf90" }
marker_selected = { fg = "#e2bd8d", bg = "#e2bd8d" }
marker_symbol   = "│"

count_copied   = { fg = "#0d0d0c", bg = "#7fcb4d" }
count_cut      = { fg = "#edebe6", bg = "#df494e" }
count_selected = { fg = "#0d0d0c", bg = "#dda65f" }

border_symbol = "│"
border_style  = { fg = "#66635c" }

syntect_theme = ""

[tabs]
active   = { fg = "#1a1a1a", bg = "#d38c55", bold = true }
inactive = { fg = "#d38c55", bg = "#322f2a" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1a1a1a", bg = "#d38c55", bold = true }
normal_alt  = { fg = "#d38c55", bg = "#322f2a" }
select_main = { fg = "#edebe6", bg = "#df494e", bold = true }
select_alt  = { fg = "#df494e", bg = "#322f2a" }
unset_main  = { fg = "#edebe6", bg = "#64c7d8", bold = true }
unset_alt   = { fg = "#64c7d8", bg = "#322f2a" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#66635c" }
perm_type  = { fg = "#7fcb4d" }
perm_read  = { fg = "#dda65f" }
perm_write = { fg = "#df494e" }
perm_exec  = { fg = "#93d369" }
progress_label  = { bold = true }
progress_normal = { fg = "#7fcb4d", bg = "#0d0d0c" }
progress_error  = { fg = "#dda65f", bg = "#df494e" }

[which]
cols            = 3
mask            = { bg = "#191715" }
cand            = { fg = "#93d369" }
rest            = { fg = "#66635c" }
desc            = { fg = "#64c7d8" }
separator       = "  "
separator_style = { fg = "#66635c" }

[confirm]
border     = { fg = "#d38c55" }
title      = { fg = "#d38c55" }
body       = { fg = "#e6e3de" }
list       = { fg = "#8c8a80" }
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#d38c55" }
title    = { fg = "#d38c55" }
tbl_col  = { fg = "#d38c55" }
tbl_cell = { fg = "#dda65f", reversed = true }

[notify]
title_info  = { fg = "#7fcb4d" }
title_warn  = { fg = "#dda65f" }
title_error = { fg = "#df494e" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#d38c55" }
active   = { fg = "#64c7d8", bold = true }
inactive = { fg = "#8c8a80" }

[input]
border   = { fg = "#d38c55" }
title    = { fg = "#e6e3de" }
value    = { fg = "#e6e3de" }
selected = { reversed = true }

[cmp]
border   = { fg = "#d38c55" }
active   = { reversed = true }
inactive = { fg = "#8c8a80" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#d38c55" }
title   = { fg = "#e6e3de" }
hovered = { fg = "#64c7d8", bold = true }

[help]
on      = { fg = "#93d369" }
run     = { fg = "#64c7d8" }
desc    = { fg = "#8c8a80" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#0d0d0c", bg = "#edebe6" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#dda65f" },
	{ mime = "{audio,video}/*", fg = "#64c7d8" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#df494e" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#93d369" },
	{ mime = "vfs/{absent,stale}", fg = "#8c8a80" },
	{ url = "*", is = "orphan", bg = "#df494e" },
	{ url = "*", is = "exec", fg = "#7fcb4d" },
	{ url = "*", is = "dummy", bg = "#df494e" },
	{ url = "*/", is = "dummy", bg = "#df494e" },
	{ url = "*/", fg = "#d38c55" },
]

