# Auto-generated by ~/.config/yazi/apply-wallpaper-theme.py — do not edit colors by hand.
# Re-run that script (or change wallpaper) to refresh the palette.
#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
dark  = ""
light = ""

[mgr]
cwd = { fg = "#74b4a2" }

find_keyword  = { fg = "#63dd5f", bold = true, italic = true, underline = true }
find_position = { fg = "#d86d64", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#66635c", italic = true }

marker_copied   = { fg = "#b090df",  bg = "#b090df" }
marker_cut      = { fg = "#e27a78",     bg = "#e27a78" }
marker_marked   = { fg = "#b090df",  bg = "#b090df" }
marker_selected = { fg = "#8fe28d", bg = "#8fe28d" }
marker_symbol   = "│"

count_copied   = { fg = "#0c0d0d", bg = "#804dcb" }
count_cut      = { fg = "#edebe6", bg = "#df4b49" }
count_selected = { fg = "#0c0d0d", bg = "#63dd5f" }

border_symbol = "│"
border_style  = { fg = "#66635c" }

syntect_theme = ""

[tabs]
active   = { fg = "#1a1a1a", bg = "#74b4a2", bold = true }
inactive = { fg = "#74b4a2", bg = "#2a322e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1a1a1a", bg = "#74b4a2", bold = true }
normal_alt  = { fg = "#74b4a2", bg = "#2a322e" }
select_main = { fg = "#edebe6", bg = "#df4b49", bold = true }
select_alt  = { fg = "#df4b49", bg = "#2a322e" }
unset_main  = { fg = "#edebe6", bg = "#d86d64", bold = true }
unset_alt   = { fg = "#d86d64", bg = "#2a322e" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#66635c" }
perm_type  = { fg = "#804dcb" }
perm_read  = { fg = "#63dd5f" }
perm_write = { fg = "#df4b49" }
perm_exec  = { fg = "#9369d3" }
progress_label  = { bold = true }
progress_normal = { fg = "#804dcb", bg = "#0c0d0d" }
progress_error  = { fg = "#63dd5f", bg = "#df4b49" }

[which]
cols            = 3
mask            = { bg = "#151917" }
cand            = { fg = "#9369d3" }
rest            = { fg = "#66635c" }
desc            = { fg = "#d86d64" }
separator       = "  "
separator_style = { fg = "#66635c" }

[confirm]
border     = { fg = "#74b4a2" }
title      = { fg = "#74b4a2" }
body       = { fg = "#e6e3de" }
list       = { fg = "#8c8a80" }
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#74b4a2" }
title    = { fg = "#74b4a2" }
tbl_col  = { fg = "#74b4a2" }
tbl_cell = { fg = "#63dd5f", reversed = true }

[notify]
title_info  = { fg = "#804dcb" }
title_warn  = { fg = "#63dd5f" }
title_error = { fg = "#df4b49" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#74b4a2" }
active   = { fg = "#d86d64", bold = true }
inactive = { fg = "#8c8a80" }

[input]
border   = { fg = "#74b4a2" }
title    = { fg = "#e6e3de" }
value    = { fg = "#e6e3de" }
selected = { reversed = true }

[cmp]
border   = { fg = "#74b4a2" }
active   = { reversed = true }
inactive = { fg = "#8c8a80" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#74b4a2" }
title   = { fg = "#e6e3de" }
hovered = { fg = "#d86d64", bold = true }

[help]
on      = { fg = "#9369d3" }
run     = { fg = "#d86d64" }
desc    = { fg = "#8c8a80" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#0c0d0d", bg = "#edebe6" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#63dd5f" },
	{ mime = "{audio,video}/*", fg = "#d86d64" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#df4b49" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#9369d3" },
	{ mime = "vfs/{absent,stale}", fg = "#8c8a80" },
	{ url = "*", is = "orphan", bg = "#df4b49" },
	{ url = "*", is = "exec", fg = "#804dcb" },
	{ url = "*", is = "dummy", bg = "#df4b49" },
	{ url = "*/", is = "dummy", bg = "#df4b49" },
	{ url = "*/", fg = "#74b4a2" },
]

