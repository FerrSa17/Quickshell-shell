# font_family Cascadia Code
font_family JetBrainsMono Nerd Font 
font_size 14.0

wayland_titlebar_color system
macos_titlebar_color system
disable_ligatures yes
enable_audio_bell no
shell_integration disabled
# Beam caret (Neovim guicursor alone cannot override Kitty's block well)
cursor_shape beam
cursor_beam_thickness 1.5
cursor_shape_unfocused hollow
url_style curly

remember_window_size no
initial_window_width 78
initial_window_height 23
window_padding_width 25
cursor_blink_interval 0

background_opacity 0.60
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

# Floating rounded tabs (bar blends into window bg)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_margin_width 6
tab_bar_margin_height 3 5
tab_bar_show_new_tab_button yes
tab_title_template " {title} "
active_tab_font_style bold
inactive_tab_font_style normal
tab_activity_symbol " •"
background_blur 32

sync_to_monitor no
repaint_delay 8
input_delay 3

include kitty_colors.conf
fish
