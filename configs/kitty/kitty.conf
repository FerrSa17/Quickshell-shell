# font_family Cascadia Code
font_family JetBrainsMono Nerd Font 
font_size 14.0

wayland_titlebar_color system
macos_titlebar_color system
disable_ligatures yes
enable_audio_bell no
shell_integration disabled
# Beam caret (Neovim guicursor alone cannot override Kitty's block well)
cursor_shape beam
cursor_beam_thickness 1.5
cursor_shape_unfocused hollow
url_style curly

remember_window_size no
initial_window_width 78
initial_window_height 23
window_padding_width 25
cursor_blink_interval 0

background_opacity 0.60
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

sync_to_monitor no
repaint_delay 8
input_delay 3

include kitty_colors.conf
